services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      API_PROXY_TARGET: "${API_PROXY_TARGET:-http://host.docker.internal:8000}"

  frontend-production:
    profiles:
      - production
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    ports:
      - "8080:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      API_PROXY_TARGET: "${API_PROXY_TARGET:-http://host.docker.internal:8000}"
      NGINX_ENVSUBST_FILTER: "^API_PROXY_TARGET$"
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
      - "5678:5678"
    volumes:
      - ./backend:/app
